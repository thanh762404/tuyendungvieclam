<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ứng tuyển - {{ job.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #00b14f;
            --primary-hover: #009543;
        }
        body {
            background-color: #f4f5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: var(--primary-color) !important;
        }
        .text-custom-primary {
            color: var(--primary-color) !important;
        }
        .btn-success-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .btn-success-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .breadcrumb-custom a {
            color: #6c757d;
            text-decoration: none;
        }
        .breadcrumb-custom a:hover {
            color: var(--primary-color);
        }
        /* Tối ưu hiển thị input form khi render qua form.as_p */
        p label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
            margin-top: 12px;
        }
        p input, p select, p textarea {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #dee2e6;
            appearance: none;
            border-radius: 8px;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }
        p input:focus, p select:focus, p textarea:focus {
            border-color: var(--primary-color);
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(0, 177, 79, 0.25);
        }
        p input[type="file"] {
            padding: 0.5rem;
        }
        p textarea {
            min-height: 100px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Thanh điều hướng đồng bộ -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}"><i class="fas fa-briefcase me-2"></i>CTJob</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3 d-none d-md-inline">Xin chào, <strong>{{ user.username }}</strong></span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">Đăng xuất</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2 px-3 rounded-pill">Đăng nhập</a>
                    <a href="{% url 'signup' %}" class="btn btn-light text-success btn-sm px-3 rounded-pill fw-semibold">Đăng ký</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 700px;">
        <!-- Đường dẫn điều hướng breadcrumb -->
        <div class="row justify-content-center mb-3">
            <div class="col-12">
                <nav aria-label="breadcrumb" class="breadcrumb-custom text-muted small">
                    <a href="{% url 'home' %}">Trang chủ</a> / <a href="{% url 'job_detail' job.pk %}">Chi tiết công việc</a> / <span class="text-dark">Ứng tuyển</span>
                </nav>
            </div>
        </div>

        <div class="card shadow-sm border-0 p-4 p-md-5 rounded-4 bg-white">
            <h2 class="text-custom-primary mb-2 fw-bold text-center"><i class="fas fa-paper-plane me-2"></i>Ứng Tuyển Công Việc</h2>
            <h5 class="text-secondary mb-4 text-center fs-6"><span class="text-dark fw-bold">{{ job.title }}</span> - <span class="text-muted">{{ job.company_name }}</span></h5>
            
            <!-- Quan trọng: Phải có enctype="multipart/form-data" để tải được file CV -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success-custom w-100 py-2.5 rounded-pill fw-semibold mt-4 shadow-sm">Gửi hồ sơ ứng tuyển</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
