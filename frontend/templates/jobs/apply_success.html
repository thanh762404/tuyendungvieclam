<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ứng tuyển thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #00b14f;
            --primary-hover: #009543;
        }
        body {
            background-color: #f4f5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: var(--primary-color) !important;
        }
        .text-custom-primary {
            color: var(--primary-color) !important;
        }
        .btn-success-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .btn-success-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .breadcrumb-custom a {
            color: #6c757d;
            text-decoration: none;
        }
        .breadcrumb-custom a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Thanh điều hướng đồng bộ -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}"><i class="fas fa-briefcase me-2"></i>CTJob</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3 d-none d-md-inline">Xin chào, <strong>{{ user.username }}</strong></span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">Đăng xuất</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2 px-3 rounded-pill">Đăng nhập</a>
                    <a href="{% url 'signup' %}" class="btn btn-light text-success btn-sm px-3 rounded-pill fw-semibold">Đăng ký</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 600px;">
        <!-- Đường dẫn điều hướng breadcrumb -->
        <div class="row justify-content-center mb-3">
            <div class="col-12">
                <nav aria-label="breadcrumb" class="breadcrumb-custom text-muted small">
                    <a href="{% url 'home' %}">Trang chủ</a> / <span class="text-dark">Ứng tuyển thành công</span>
                </nav>
            </div>
        </div>

        <div class="text-center d-flex align-items-center justify-content-center">
            <div class="card shadow-sm border-0 p-5 rounded-4 bg-white w-100">
                <div class="mb-3 text-success fs-1">
                    <i class="fas fa-check-circle" style="color: var(--primary-color) !important;"></i>
                </div>
                <h3 class="fw-bold mb-3" style="color: var(--primary-color) !important;">Ứng Tuyển Thành Công!</h3>
                <p class="text-muted mb-4">Hồ sơ của bạn đã được gửi đến nhà tuyển dụng cho vị trí <strong class="text-dark">{{ job.title }}</strong>.</p>
                
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
